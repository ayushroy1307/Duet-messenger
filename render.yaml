services:
  - type: web
    name: duet
    runtime: node
    plan: free
    region: oregon
    buildCommand: "echo 'Duet has no build step and no npm dependencies'"
    startCommand: "node server/index.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false