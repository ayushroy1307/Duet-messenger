<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F7FA">
  <meta name="description" content="Duet is a private messenger for exactly two people. Your keys stay on your device.">
  <meta name="application-name" content="Duet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duet">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Duet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot-splash" role="status" aria-live="polite">
      <span class="logo-mark boot-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.4 6.2A5.8 5.8 0 0 0 3 11.9c0 2 .9 3.7 2.4 4.9V21l4.1-2.1a6.4 6.4 0 0 0 2.5.5c3.5 0 6.4-2.8 6.4-6.2S15.5 7 12 7a7 7 0 0 0-3.6.9"></path>
          <path d="M18.4 13.2a5.3 5.3 0 0 1-1.2 3.3V20l-3-1.5a5.6 5.6 0 0 1-2 .3c-2.2 0-4.1-1.2-5.1-3"></path>
        </svg>
      </span>
      <p class="boot-word">Duet</p>
      <span class="spinner" aria-label="Opening Duet"></span>
    </div>
  </div>
  <noscript>
    <div class="noscript-card">
      <h1>Duet needs JavaScript</h1>
      <p>All encryption happens on your device. Without JavaScript the app cannot open your vault or read messages.</p>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
