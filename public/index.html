<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F7FA">
  <meta name="description" content="Duet is a private messenger for exactly two people. Your keys stay on your device.">
  <meta name="application-name" content="Duet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duet">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Duet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot-splash" role="status" aria-live="polite">
      <svg class="logo-mark boot-logo" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="boot-plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F9FAFE"></stop>
            <stop offset=".55" stop-color="#ECEEF6"></stop>
            <stop offset="1" stop-color="#DDE0EE"></stop>
          </linearGradient>
          <linearGradient id="boot-violet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7A47FF"></stop>
            <stop offset="1" stop-color="#6130E8"></stop>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#boot-plate)"></rect>
        <rect x="11.5" y="13.5" width="21" height="37" rx="7.5" fill="#FFFFFF" stroke="#1A1C2E" stroke-opacity=".07" stroke-width=".75"></rect>
        <path fill="url(#boot-violet)" d="M33 13h8a17 17 0 0 1 0 34h-4l-3.6 5.2L30 47h-2.5z"></path>
        <path fill="#15161F" d="M23 32 30 24.5h8.5a8.75 8.75 0 0 1 0 17.5H30Z"></path>
        <circle cx="28.2" cy="33.2" r="1.9" fill="#7A47FF"></circle>
        <circle cx="33.6" cy="33.2" r="1.9" fill="#FFFFFF"></circle>
        <circle cx="39" cy="33.2" r="1.9" fill="#7A47FF"></circle>
      </svg>
      <p class="boot-word">Duet</p>
      <span class="spinner" aria-label="Opening Duet"></span>
    </div>
  </div>
  <noscript>
    <div class="noscript-card">
      <h1>Duet needs JavaScript</h1>
      <p>All encryption happens on your device. Without JavaScript the app cannot open your vault or read messages.</p>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
